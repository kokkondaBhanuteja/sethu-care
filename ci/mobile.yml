# Copy to .github/workflows/mobile.yml
name: mobile

# Always runs (no `paths:` filter) so the REQUIRED "mobile" check always reports instead of hanging
# on GitHub as "Expected" on backend-only PRs. The first step detects mobile changes; the heavy
# steps skip when there are none, and the job still completes green in seconds.
on:
  push:
    branches: [developer, main]
  pull_request:

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so change detection can diff against the base

      # Self-contained change detection (no third-party action → no Node-runtime deprecation).
      # working-directory: . so git runs at the repo root, not in mobile/.
      - name: Detect mobile changes
        id: changes
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if ! git cat-file -e "$base" 2>/dev/null; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$base" "$head" \
            | grep -qE '(^mobile/|^api/openapi\.yaml$|^\.github/workflows/mobile\.yml$)'; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No mobile changes — reporting success
        if: steps.changes.outputs.mobile != 'true'
        working-directory: .
        run: echo "No mobile files changed; skipping mobile checks."

      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.mobile == 'true'
        with:
          version: 10

      - uses: actions/setup-node@v5
        if: steps.changes.outputs.mobile == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Install
        if: steps.changes.outputs.mobile == 'true'
        run: pnpm install --frozen-lockfile

      - name: Generated API client is up to date (drift guard)
        if: steps.changes.outputs.mobile == 'true'
        run: |
          pnpm --filter @sethu/api-client run generate
          git diff --exit-code packages/api-client/src/generated \
            || (echo "::error::packages/api-client is stale — run 'pnpm api:generate' and commit." && exit 1)

      - name: Typecheck
        if: steps.changes.outputs.mobile == 'true'
        run: pnpm typecheck

      - name: Lint
        if: steps.changes.outputs.mobile == 'true'
        run: pnpm lint

      - name: Format check
        if: steps.changes.outputs.mobile == 'true'
        run: pnpm format:check
