components:
  schemas:
    AccountDisabledError:
      additionalProperties: false
      properties:
        error:
          description: Always ACCOUNT_DISABLED.
          type: string
      required:
        - error
      type: object
    AccountLockedError:
      additionalProperties: false
      properties:
        error:
          description: Always ACCOUNT_LOCKED.
          type: string
        retryAfter:
          description: Seconds. The UI counts it down live.
          format: int32
          type: integer
      required:
        - error
        - retryAfter
      type: object
    AcknowledgeAlertResult:
      additionalProperties: false
      properties:
        alert:
          $ref: "#/components/schemas/Alert"
        wonRace:
          description: "False when another admin acknowledged first. Not an error: the console shows 'acknowledged by someone else' rather than a failure toast."
          type: boolean
      required:
        - alert
        - wonRace
      type: object
    ActiveJobStage:
      enum:
        - en_route
        - in_progress
      type: string
    ActivityEntry:
      additionalProperties: false
      properties:
        at:
          format: date-time
          type: string
        bookingRef:
          type: string
        id:
          type: string
        kind:
          $ref: "#/components/schemas/ActivityKind"
        providerName:
          description: Only the assigned kind carries one.
          type:
            - string
            - "null"
      required:
        - at
        - bookingRef
        - id
        - kind
        - providerName
      type: object
    ActivityFeed:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/ActivityEntry"
          type: array
      required:
        - items
      type: object
    ActivityKind:
      description: "An enum, not a prose sentence: the console localises it."
      enum:
        - completed
        - started
        - en_route
        - assigned
        - awaiting_otp
        - cancelled_by_customer
      type: string
    AddressResponse:
      additionalProperties: false
      properties:
        city:
          type: string
        id:
          type: string
        is_default:
          type: boolean
        label:
          type: string
        lat:
          format: double
          type: number
        line1:
          type: string
        line2:
          type: string
        lng:
          format: double
          type: number
        pincode:
          type: string
      type: object
    AdminActivitySummary:
      additionalProperties: false
      properties:
        actions:
          format: int32
          type: integer
        averageAcknowledgeMs:
          format: int64
          type: integer
        bookingsRescued:
          format: int32
          type: integer
        escalationsAcknowledged:
          format: int32
          type: integer
      required:
        - actions
        - averageAcknowledgeMs
        - bookingsRescued
        - escalationsAcknowledged
      type: object
    AdminBootstrap:
      additionalProperties: false
      properties:
        hasSession:
          type: boolean
        isBiometricEnabled:
          description: A stored session plus biometric opt-in routes through /unlock.
          type: boolean
        isVersionSupported:
          description: False routes to the blocking forced-update screen — an unsupported build misreports live state.
          type: boolean
      required:
        - hasSession
        - isBiometricEnabled
        - isVersionSupported
      type: object
    AdminError:
      additionalProperties: false
      properties:
        code:
          description: "Machine-readable code. The console additionally derives ApiError.code from the status: 400/422 -> validation, 401 -> unauthorized, 403 -> forbidden, 404 -> not_found, 409 -> conflict, 429 -> rate_limited, 5xx -> server."
          type: string
        fields:
          additionalProperties:
            type: string
          description: Per-field validation messages, keyed by the request field name.
          type: object
        message:
          description: Human-readable explanation. Never rendered verbatim to an operator.
          type: string
      required:
        - code
        - message
      type: object
    AdminLoginRequest:
      additionalProperties: false
      properties:
        deviceId:
          type: string
        deviceName:
          type: string
        email:
          type: string
        password:
          type: string
      required:
        - deviceId
        - deviceName
        - email
        - password
      type: object
    AdminLoginResult:
      additionalProperties: false
      properties:
        challenge:
          anyOf:
            - $ref: "#/components/schemas/OtpChallenge"
            - type: "null"
          description: Present when status is otp_required.
        session:
          anyOf:
            - $ref: "#/components/schemas/AdminSession"
            - type: "null"
          description: Present when status is authenticated.
        status:
          $ref: "#/components/schemas/AdminLoginStatus"
      required:
        - status
      type: object
    AdminLoginStatus:
      description: "`authenticated` only on an already-trusted device, which skips the second factor."
      enum:
        - otp_required
        - authenticated
      type: string
    AdminPreferences:
      additionalProperties: false
      properties:
        appearance:
          $ref: "#/components/schemas/AppearanceMode"
        defaultLandingRoute:
          type: string
        haptics:
          type: boolean
      required:
        - appearance
        - defaultLandingRoute
        - haptics
      type: object
    AdminProfile:
      additionalProperties: false
      properties:
        activity:
          $ref: "#/components/schemas/AdminActivitySummary"
        adminId:
          type: string
        email:
          type: string
        joinedIso:
          format: date-time
          type: string
        maskedPhone:
          description: Masked at the source. The full number is never sent to this client.
          type: string
        name:
          type: string
        preferences:
          $ref: "#/components/schemas/AdminPreferences"
        role:
          type: string
      required:
        - activity
        - adminId
        - email
        - joinedIso
        - maskedPhone
        - name
        - preferences
        - role
      type: object
    AdminResendOtpRequest:
      additionalProperties: false
      properties:
        challengeId:
          type: string
      required:
        - challengeId
      type: object
    AdminSession:
      additionalProperties: false
      properties:
        permissions:
          description: Action ids this account may perform. null means full access, which is the v1 single-role behaviour.
          items:
            type: string
          type:
            - array
            - "null"
        token:
          type: string
        user:
          $ref: "#/components/schemas/AdminSessionUser"
      required:
        - permissions
        - token
        - user
      type: object
    AdminSessionUser:
      additionalProperties: false
      properties:
        email:
          type: string
        id:
          type: string
        name:
          type: string
        role:
          description: Always ADMIN for this console. Provisioning happens in the web dashboard.
          type: string
      required:
        - email
        - id
        - name
        - role
      type: object
    AdminUnlockRequest:
      additionalProperties: false
      properties:
        password:
          type: string
      required:
        - password
      type: object
    AdminVerifyOtpRequest:
      additionalProperties: false
      properties:
        challengeId:
          type: string
        code:
          type: string
        deviceId:
          type: string
        trustDevice:
          type: boolean
      required:
        - challengeId
        - code
        - deviceId
        - trustDevice
      type: object
    Alert:
      additionalProperties: false
      properties:
        acknowledgement:
          anyOf:
            - $ref: "#/components/schemas/AlertAcknowledgement"
            - type: "null"
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        requiresAcknowledgement:
          description: Only the critical tier claims ownership. Everything else is a notification.
          type: boolean
        severity:
          $ref: "#/components/schemas/AlertSeverity"
        subject:
          anyOf:
            - $ref: "#/components/schemas/AlertSubject"
            - type: "null"
        summaryParams:
          $ref: "#/components/schemas/AlertSummaryParams"
          description: Values for the supporting line, composed by the console.
        titleParams:
          $ref: "#/components/schemas/AlertTitleParams"
        type:
          $ref: "#/components/schemas/AlertType"
      required:
        - acknowledgement
        - createdAt
        - id
        - requiresAcknowledgement
        - severity
        - subject
        - summaryParams
        - titleParams
        - type
      type: object
    AlertAcknowledgement:
      additionalProperties: false
      properties:
        acknowledgedAt:
          format: date-time
          type: string
        adminId:
          type: string
        adminName:
          type: string
      required:
        - acknowledgedAt
        - adminId
        - adminName
      type: object
    AlertBandExample:
      additionalProperties: false
      properties:
        bookingRef:
          type: string
        priority:
          $ref: "#/components/schemas/AttentionPriority"
        surfacedAt:
          format: date-time
          type: string
      required:
        - bookingRef
        - priority
        - surfacedAt
      type: object
    AlertBandState:
      additionalProperties: false
      properties:
        criticalCount:
          description: Unacknowledged criticals. Above 9 the band renders '9+'.
          format: int32
          type: integer
        examples:
          description: "At most two, by design: the band is a pointer into the queue, not the queue."
          items:
            $ref: "#/components/schemas/AlertBandExample"
          type: array
      required:
        - criticalCount
        - examples
      type: object
    AlertDetail:
      additionalProperties: false
      properties:
        acknowledgement:
          anyOf:
            - $ref: "#/components/schemas/AlertAcknowledgement"
            - type: "null"
        canMute:
          description: Critical types cannot be muted, and the ceiling is shown up front.
          type: boolean
        createdAt:
          format: date-time
          type: string
        description:
          type: string
        history:
          items:
            $ref: "#/components/schemas/AlertHistoryEntry"
          type: array
        id:
          type: string
        notes:
          items:
            $ref: "#/components/schemas/AlertNote"
          type: array
        relatedAlerts:
          items:
            $ref: "#/components/schemas/RelatedAlertLink"
          type: array
        relatedRecord:
          anyOf:
            - $ref: "#/components/schemas/RelatedRecord"
            - type: "null"
        requiresAcknowledgement:
          description: Only the critical tier claims ownership. Everything else is a notification.
          type: boolean
        severity:
          $ref: "#/components/schemas/AlertSeverity"
        subject:
          anyOf:
            - $ref: "#/components/schemas/AlertSubject"
            - type: "null"
        summaryParams:
          $ref: "#/components/schemas/AlertSummaryParams"
          description: Values for the supporting line, composed by the console.
        titleParams:
          $ref: "#/components/schemas/AlertTitleParams"
        trigger:
          $ref: "#/components/schemas/AlertTrigger"
        type:
          $ref: "#/components/schemas/AlertType"
      required:
        - canMute
        - description
        - history
        - notes
        - relatedAlerts
        - relatedRecord
        - trigger
        - acknowledgement
        - createdAt
        - id
        - requiresAcknowledgement
        - severity
        - subject
        - summaryParams
        - titleParams
        - type
      type: object
    AlertHistoryEntry:
      additionalProperties: false
      properties:
        at:
          format: date-time
          type: string
        body:
          type: string
        id:
          type: string
        tone:
          $ref: "#/components/schemas/AlertHistoryTone"
      required:
        - at
        - body
        - id
        - tone
      type: object
    AlertHistoryTone:
      enum:
        - info
        - danger
        - neutral
      type: string
    AlertNote:
      additionalProperties: false
      properties:
        authorName:
          type: string
        body:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: string
      required:
        - authorName
        - body
        - createdAt
        - id
      type: object
    AlertSeverity:
      description: "Three values, not five labels: the design only ever draws three visual tiers. High and Medium triggers both land on `warning`."
      enum:
        - critical
        - warning
        - informational
      type: string
    AlertSubject:
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          $ref: "#/components/schemas/AlertSubjectKind"
        reference:
          description: "The human reference the design prints in mono, e.g. #B-8823."
          type: string
      required:
        - id
        - kind
        - reference
      type: object
    AlertSubjectKind:
      enum:
        - booking
        - provider
      type: string
    AlertSummaryParams:
      additionalProperties: true
      properties:
        reference:
          type: string
        service:
          type: string
        zone:
          type: string
      type: object
    AlertTitleParams:
      additionalProperties: true
      properties:
        date:
          type: string
        name:
          type: string
        rating:
          type: string
        reference:
          type: string
      type: object
    AlertTrigger:
      additionalProperties: false
      properties:
        actual:
          type: string
        rule:
          type: string
        threshold:
          type: string
      required:
        - actual
        - rule
        - threshold
      type: object
    AlertType:
      enum:
        - bookingEscalated
        - assignmentFailed
        - slaAtRisk
        - slaBreached
        - newApplication
        - providerAutoSuspended
        - lowRating
        - paymentFailed
        - dailySummary
      type: string
    AlertsPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Alert"
          type: array
        nextCursor:
          type:
            - string
            - "null"
        total:
          format: int32
          type: integer
      required:
        - items
        - total
      type: object
    AnalyticsMetric:
      additionalProperties: false
      properties:
        id:
          type: string
        points:
          description: One point per bucket in the requested period.
          items:
            format: double
            type: number
          type: array
        unit:
          $ref: "#/components/schemas/MetricUnit"
        value:
          format: double
          type: number
      required:
        - id
        - points
        - unit
        - value
      type: object
    AnalyticsSummary:
      additionalProperties: false
      properties:
        bucketStarts:
          items:
            format: date-time
            type: string
          type: array
        metrics:
          items:
            $ref: "#/components/schemas/AnalyticsMetric"
          type: array
        period:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - bucketStarts
        - metrics
        - period
        - updatedAt
      type: object
    AppVersion:
      additionalProperties: false
      properties:
        app:
          type: string
        build:
          type: string
        bundle:
          description: OTA bundle id.
          type: string
        environment:
          type: string
      required:
        - app
        - build
        - bundle
        - environment
      type: object
    AppearanceMode:
      enum:
        - light
        - dark
        - system
      type: string
    ApplicationCategory:
      additionalProperties: false
      properties:
        name:
          type: string
        yearsClaimed:
          format: int32
          type: integer
      required:
        - name
        - yearsClaimed
      type: object
    ApplicationCounts:
      additionalProperties: false
      properties:
        awaitingDocs:
          format: int32
          type: integer
        decided:
          format: int32
          type: integer
        pending:
          format: int32
          type: integer
      required:
        - awaitingDocs
        - decided
        - pending
      type: object
    ApplicationDecidedError:
      additionalProperties: false
      properties:
        code:
          description: Always ALREADY_DECIDED.
          type: string
        decision:
          $ref: "#/components/schemas/ApplicationDecision"
          description: The decision, decider and timestamp, so the console can render the already-decided record.
        message:
          type: string
      required:
        - code
        - decision
        - message
      type: object
    ApplicationDecision:
      additionalProperties: false
      properties:
        at:
          format: date-time
          type: string
        byName:
          type: string
        outcome:
          $ref: "#/components/schemas/ApplicationDecisionOutcome"
      required:
        - at
        - byName
        - outcome
      type: object
    ApplicationDecisionOutcome:
      enum:
        - approved
        - rejected
      type: string
    ApplicationDecisionResult:
      additionalProperties: false
      properties:
        applicantName:
          type: string
        applicationId:
          type: string
        version:
          format: int32
          type: integer
      required:
        - applicantName
        - applicationId
      type: object
    ApplicationDocument:
      additionalProperties: false
      properties:
        detail:
          description: Account tail, certificate number — whatever the row shows instead of an expiry.
          type: string
        expiresAt:
          format: date-time
          type: string
        id:
          type: string
        ocrExpected:
          type: string
        ocrRead:
          description: OCR verdict shown under a failed row.
          type: string
        pageHeading:
          type: string
        pageLineWidths:
          description: Placeholder geometry the desktop viewer draws with zero network.
          items:
            format: double
            type: number
          type: array
        pageNameLine:
          type: string
        sizeBytes:
          description: The scan's size. The console formats it.
          format: int64
          type: integer
        type:
          $ref: "#/components/schemas/DocumentType"
        uploadedAt:
          format: date-time
          type: string
        url:
          description: The scan itself, for the document viewer.
          type: string
        validation:
          $ref: "#/components/schemas/DocumentValidation"
      required:
        - id
        - type
        - validation
      type: object
    ApplicationQueue:
      additionalProperties: false
      properties:
        counts:
          $ref: "#/components/schemas/ApplicationCounts"
        nextCursor:
          type:
            - string
            - "null"
        oldestDays:
          description: Age of the oldest undecided application, against the 48-hour SLA.
          format: int32
          type: integer
        rows:
          items:
            $ref: "#/components/schemas/ApplicationRow"
          type: array
        total:
          format: int32
          type: integer
      required:
        - counts
        - oldestDays
        - rows
      type: object
    ApplicationReview:
      additionalProperties: false
      properties:
        address:
          type: string
        applicantName:
          type: string
        appliedAt:
          format: date-time
          type: string
        approvalBlockers:
          items:
            $ref: "#/components/schemas/ApprovalBlocker"
          type: array
        autoValidation:
          items:
            $ref: "#/components/schemas/AutoValidationCheck"
          type: array
        backgroundClearedAt:
          format: date-time
          type:
            - string
            - "null"
        categories:
          items:
            $ref: "#/components/schemas/ApplicationCategory"
          type: array
        daysWaiting:
          format: int32
          type:
            - integer
            - "null"
        decision:
          $ref: "#/components/schemas/ApplicationDecision"
        documents:
          items:
            $ref: "#/components/schemas/ApplicationDocument"
          type: array
        documentsRequired:
          format: int32
          type: integer
        email:
          type: string
        id:
          type: string
        phone:
          type: string
        priorApplications:
          format: int32
          type: integer
        version:
          format: int32
          type: integer
      required:
        - address
        - applicantName
        - appliedAt
        - approvalBlockers
        - autoValidation
        - backgroundClearedAt
        - categories
        - daysWaiting
        - documents
        - documentsRequired
        - email
        - id
        - phone
        - priorApplications
        - version
      type: object
    ApplicationRow:
      additionalProperties: false
      properties:
        applicantName:
          type: string
        appliedAt:
          format: date-time
          type: string
        awaitingDocumentType:
          $ref: "#/components/schemas/DocumentType"
        categories:
          items:
            type: string
          type: array
        daysWaiting:
          description: Null once decided — the 48-hour clock stops with the decision.
          format: int32
          type:
            - integer
            - "null"
        decidedAt:
          format: date-time
          type: string
        documentsPresent:
          format: int32
          type: integer
        documentsRequired:
          format: int32
          type: integer
        id:
          type: string
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        zone:
          type: string
      required:
        - applicantName
        - appliedAt
        - categories
        - daysWaiting
        - documentsPresent
        - documentsRequired
        - id
        - status
        - zone
      type: object
    ApplicationSegment:
      enum:
        - pending
        - awaitingDocs
        - decided
      type: string
    ApplicationStatus:
      enum:
        - pending
        - awaiting_docs
        - approved
        - rejected
      type: string
    ApprovalBlocker:
      additionalProperties: false
      properties:
        code:
          $ref: "#/components/schemas/ApprovalBlockerCode"
        documentType:
          $ref: "#/components/schemas/DocumentType"
        id:
          type: string
      required:
        - code
        - id
      type: object
    ApprovalBlockerCode:
      description: Why approval is blocked, as a code.
      enum:
        - POLICE_VERIFICATION_PENDING
        - MISSING_DOCUMENT
        - EXPIRED_DOCUMENT
      type: string
    ApproveApplicationRequest:
      additionalProperties: false
      properties:
        version:
          format: int32
          type: integer
      required:
        - version
      type: object
    AssignContext:
      additionalProperties: false
      properties:
        booking:
          $ref: "#/components/schemas/BookingActionSubject"
        candidates:
          items:
            $ref: "#/components/schemas/ProviderCandidate"
          type: array
        declinedCount:
          format: int32
          type: integer
        isBlockedOffline:
          description: The server itself refuses to serve a stale candidate list.
          type: boolean
        rankingWeights:
          items:
            $ref: "#/components/schemas/RankingWeight"
          type: array
        rounds:
          items:
            $ref: "#/components/schemas/DispatchRound"
          type: array
      required:
        - booking
        - candidates
        - declinedCount
        - isBlockedOffline
        - rankingWeights
        - rounds
      type: object
    AssignOutputBody:
      additionalProperties: false
      properties:
        booking_id:
          type: string
        state:
          type: string
      type: object
    AssignRequest:
      additionalProperties: false
      properties:
        technician_id:
          type: string
      type: object
    AttentionCounts:
      additionalProperties: false
      properties:
        all:
          format: int32
          type: integer
        delayed:
          format: int32
          type: integer
        escalated:
          format: int32
          type: integer
        sla:
          format: int32
          type: integer
        unassigned:
          format: int32
          type: integer
      required:
        - all
        - delayed
        - escalated
        - sla
        - unassigned
      type: object
    AttentionDiagnosis:
      additionalProperties: false
      properties:
        declinedCount:
          description: Providers that declined, where the diagnosis is a failed assignment.
          format: int32
          type:
            - integer
            - "null"
        dispatchRounds:
          description: Auto-dispatch rounds attempted, where the diagnosis is a failed assignment.
          format: int32
          type:
            - integer
            - "null"
        minutesOverdue:
          description: Minutes past the SLA or the promised slot, where the diagnosis is a breach or a risk.
          format: int32
          type:
            - integer
            - "null"
      required:
        - declinedCount
        - dispatchRounds
        - minutesOverdue
      type: object
    AttentionFilter:
      enum:
        - all
        - escalated
        - unassigned
        - sla
        - delayed
      type: string
    AttentionItem:
      additionalProperties: false
      properties:
        acknowledged:
          type: boolean
        alertId:
          description: What acknowledgeAlert acts on. Distinct from the booking it points at.
          type: string
        amountPaise:
          format: int64
          type: integer
        area:
          type: string
        bookingId:
          type: string
        bookingRef:
          type: string
        customerName:
          type: string
        diagnosis:
          $ref: "#/components/schemas/AttentionDiagnosis"
          description: The numbers behind the row's coloured line. Composed into a sentence by the console, alongside priority.
        priority:
          $ref: "#/components/schemas/AttentionPriority"
        providerName:
          type:
            - string
            - "null"
        providerState:
          anyOf:
            - $ref: "#/components/schemas/AttentionProviderState"
            - type: "null"
        service:
          type: string
        slotAt:
          format: date-time
          type: string
        surfacedAt:
          description: When the problem surfaced. The age column is derived, never sent pre-formatted.
          format: date-time
          type: string
      required:
        - acknowledged
        - alertId
        - amountPaise
        - area
        - bookingId
        - bookingRef
        - customerName
        - diagnosis
        - priority
        - providerName
        - providerState
        - service
        - slotAt
        - surfacedAt
      type: object
    AttentionLastCleared:
      additionalProperties: false
      properties:
        adminName:
          type: string
        at:
          format: date-time
          type: string
        bookingRef:
          type: string
      required:
        - adminName
        - at
        - bookingRef
      type: object
    AttentionPriority:
      description: Declared worst-first. The SERVER owns the feed's order (tiers, oldest first within a tier); the client never re-sorts. It also names the diagnosis the console renders.
      enum:
