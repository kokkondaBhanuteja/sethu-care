          type:
            - string
            - "null"
      required:
        - atIso
        - device
        - id
        - kind
        - location
      type: object
    SecurityEventKind:
      enum:
        - signedIn
        - failedSignIn
        - deviceTrusted
        - passwordChanged
      type: string
    SecuritySettings:
      additionalProperties: false
      properties:
        activeSessions:
          format: int32
          type: integer
        biometricUnlock:
          type: boolean
        deviceLimit:
          format: int32
          type: integer
        devices:
          items:
            $ref: "#/components/schemas/TrustedDevice"
          type: array
        events:
          items:
            $ref: "#/components/schemas/SecurityEvent"
          type: array
        passwordChangedAtIso:
          format: date-time
          type: string
      required:
        - activeSessions
        - biometricUnlock
        - deviceLimit
        - devices
        - events
        - passwordChangedAtIso
      type: object
    ServiceResponse:
      additionalProperties: false
      properties:
        assignment_mode:
          type: string
        category_id:
          type: string
        description:
          type: string
        estimated_minutes:
          format: int32
          type: integer
        id:
          type: string
        name:
          type: string
        questions:
          items:
            $ref: "#/components/schemas/QuestionResponse"
          type:
            - array
            - "null"
        slug:
          type: string
        variants:
          items:
            $ref: "#/components/schemas/VariantResponse"
          type:
            - array
            - "null"
      type: object
    SetAvailabilityOutputBody:
      additionalProperties: false
      properties:
        online:
          type: boolean
      type: object
    ShellCounters:
      additionalProperties: false
      properties:
        criticalAlerts:
          description: Unacknowledged CRITICAL alerts only. The badge must mean 'a human must act'.
          format: int32
          type: integer
        needsAttention:
          format: int32
          type: integer
        openTickets:
          format: int32
          type: integer
        pendingApplications:
          format: int32
          type: integer
      required:
        - criticalAlerts
        - needsAttention
        - openTickets
        - pendingApplications
      type: object
    SignatureResponse:
      additionalProperties: false
      properties:
        api_key:
          type: string
        cloud_name:
          type: string
        folder:
          type: string
        signature:
          type: string
        timestamp:
          format: int64
          type: integer
      type: object
    StaleVersionError:
      additionalProperties: false
      properties:
        code:
          description: Always VERSION_CONFLICT.
          type: string
        currentVersion:
          description: The version the record actually carries now.
          format: int32
          type: integer
        message:
          type: string
      required:
        - code
        - currentVersion
        - message
      type: object
    StatusOutputBody:
      additionalProperties: false
      properties:
        status:
          type: string
      type: object
    SummaryResponse:
      additionalProperties: false
      properties:
        booking_id:
          type: string
        city:
          type: string
        created_at:
          format: date-time
          type: string
        quoted_total:
          type: string
        scheduled_for:
          format: date-time
          type: string
        service_name:
          type: string
        state:
          type: string
      type: object
    SuspendActionType:
      description: One payload serves all three outcomes; `type` decides which. force_offline is medium risk with a 30s undo, suspend high, block critical.
      enum:
        - force_offline
        - suspend
        - block
      type: string
    SuspendProviderRequest:
      additionalProperties: false
      properties:
        durationDays:
          description: Null for force_offline and block.
          format: int32
          type:
            - integer
            - "null"
        jobResolutions:
          additionalProperties:
            $ref: "#/components/schemas/JobResolution"
          description: bookingId -> how the operator chose to handle it.
          type: object
        note:
          type: string
        notifyImmediately:
          type: boolean
        reasonCode:
          $ref: "#/components/schemas/SuspendReasonCode"
        type:
          $ref: "#/components/schemas/SuspendActionType"
        version:
          format: int32
          type: integer
      required:
        - durationDays
        - jobResolutions
        - note
        - notifyImmediately
        - reasonCode
        - type
        - version
      type: object
    SuspendProviderResult:
      additionalProperties: false
      properties:
        durationDays:
          format: int32
          type:
            - integer
            - "null"
        effectiveUntil:
          format: date-time
          type:
            - string
            - "null"
        providerId:
          type: string
        type:
          $ref: "#/components/schemas/SuspendActionType"
        version:
          format: int32
          type: integer
      required:
        - durationDays
        - effectiveUntil
        - providerId
        - type
      type: object
    SuspendReasonCode:
      enum:
        - safety_complaint
        - repeated_cancellations
        - poor_quality
        - fraud_suspected
        - document_expired
        - unprofessional
        - no_show_pattern
        - policy_violation
        - other
      type: string
    TechnicianLocationResponse:
      additionalProperties: false
      properties:
        available:
          type: boolean
        lat:
          format: double
          type: number
        lng:
          format: double
          type: number
        updated_at:
          type: string
      type: object
    TechnicianResponse:
      additionalProperties: false
      properties:
        acceptance_rate:
          format: double
          type: number
        active_jobs:
          format: int32
          type: integer
        city:
          type: string
        is_online:
          type: boolean
        max_concurrent_jobs:
          format: int32
          type: integer
        name:
          type: string
        on_leave:
          type: boolean
        rating:
          format: double
          type: number
        technician_id:
          type: string
      type: object
    TechniciansOutputBody:
      additionalProperties: false
      properties:
        technicians:
          items:
            $ref: "#/components/schemas/TechnicianResponse"
          type:
            - array
            - "null"
      type: object
    TicketAuthorKind:
      enum:
        - customer
        - admin
        - system
      type: string
    TicketDetail:
      additionalProperties: false
      properties:
        bookingRef:
          type:
            - string
            - "null"
        createdAt:
          format: date-time
          type: string
        customerName:
          type: string
        id:
          type: string
        messages:
          items:
            $ref: "#/components/schemas/TicketMessage"
          type: array
        priority:
          $ref: "#/components/schemas/TicketPriority"
        reference:
          type: string
        status:
          $ref: "#/components/schemas/TicketStatus"
        subject:
          type: string
        updatedAt:
          format: date-time
          type: string
        version:
          format: int32
          type: integer
      required:
        - messages
        - version
        - createdAt
        - customerName
        - id
        - priority
        - reference
        - status
        - subject
        - updatedAt
      type: object
    TicketListItem:
      additionalProperties: false
      properties:
        bookingRef:
          type:
            - string
            - "null"
        createdAt:
          format: date-time
          type: string
        customerName:
          type: string
        id:
          type: string
        priority:
          $ref: "#/components/schemas/TicketPriority"
        reference:
          type: string
        status:
          $ref: "#/components/schemas/TicketStatus"
        subject:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - createdAt
        - customerName
        - id
        - priority
        - reference
        - status
        - subject
        - updatedAt
      type: object
    TicketMessage:
      additionalProperties: false
      properties:
        at:
          format: date-time
          type: string
        authorKind:
          $ref: "#/components/schemas/TicketAuthorKind"
        authorName:
          type: string
        body:
          type: string
        id:
          type: string
      required:
        - at
        - authorKind
        - authorName
        - body
        - id
      type: object
    TicketPriority:
      enum:
        - low
        - normal
        - high
        - urgent
      type: string
    TicketReplyRequest:
      additionalProperties: false
      properties:
        body:
          type: string
        version:
          format: int32
          type: integer
      required:
        - body
        - version
      type: object
    TicketStatus:
      enum:
        - open
        - pending_customer
        - resolved
        - closed
      type: string
    TicketsPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/TicketListItem"
          type: array
        nextCursor:
          type:
            - string
            - "null"
        total:
          format: int32
          type: integer
      required:
        - items
        - total
      type: object
    TransitionRequest:
      additionalProperties: false
      properties:
        action:
          type: string
        code:
          type: string
        payment_method:
          type: string
        technician_id:
          type: string
      type: object
    TrustedDevice:
      additionalProperties: false
      properties:
        id:
          type: string
        isCurrent:
          type: boolean
        kind:
          $ref: "#/components/schemas/DeviceKind"
        lastUsedIso:
          format: date-time
          type: string
        location:
          type: string
        name:
          type: string
      required:
        - id
        - isCurrent
        - kind
        - lastUsedIso
        - location
        - name
      type: object
    UndoRequest:
      additionalProperties: false
      properties:
        undoes:
          $ref: "#/components/schemas/UndoTarget"
        version:
          format: int32
          type: integer
      required:
        - undoes
        - version
      type: object
    UndoTarget:
      enum:
        - assign
        - cancel
      type: string
    UpdateAdminProfileRequest:
      additionalProperties: false
      properties:
        preferences:
          $ref: "#/components/schemas/AdminPreferences"
      required:
        - preferences
      type: object
    UpdateLocationOutputBody:
      additionalProperties: false
      properties:
        status:
          type: string
      type: object
    UpdateNotificationSettingsRequest:
      additionalProperties: false
      properties:
        channels:
          $ref: "#/components/schemas/NotificationChannelSettings"
        criticalSound:
          type: string
        digestTime:
          $ref: "#/components/schemas/ClockTime"
        quietHours:
          $ref: "#/components/schemas/QuietHours"
        vibrate:
          type: boolean
      required:
        - channels
        - criticalSound
        - digestTime
        - quietHours
        - vibrate
      type: object
    UpdateSecuritySettingsRequest:
      additionalProperties: false
      properties:
        biometricUnlock:
          type: boolean
      required:
        - biometricUnlock
      type: object
    VariantResponse:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: string
        price_paise:
          format: int64
          type: integer
      type: object
    VerifyRequest:
      additionalProperties: false
      properties:
        code:
          type: string
        phone:
          type: string
      type: object
    VerifyResponse:
      additionalProperties: false
      properties:
        name:
          type: string
        role:
          type: string
        token:
          type: string
      type: object
    ZoneSupply:
      additionalProperties: false
      properties:
        onlineCount:
          format: int32
          type: integer
        threshold:
          format: int32
          type: integer
        zone:
          type: string
      required:
        - onlineCount
        - threshold
        - zone
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  title: SETHU-CARE API
  version: 1.0.0
openapi: 3.1.0
paths:
  /addresses:
    get:
      operationId: listAddresses
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAddressesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List my addresses
      tags:
        - Addresses
    post:
      operationId: createAddress
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAddressRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressResponse"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Create an address
      tags:
        - Addresses
  /admin/auth/2fa:
    post:
      operationId: adminVerifyOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminVerifyOtpRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidOtpError"
          description: Wrong code
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceLimitError"
          description: Trust slots full
        "410":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpExpiredError"
          description: Expired code
        "423":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountLockedError"
          description: Attempts exhausted
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminError"
          description: Error
      summary: Verify the second factor and open a session
      tags:
        - Admin Auth
  /admin/auth/2fa/resend:
    post:
      operationId: adminResendOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminResendOtpRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallenge"
          description: OK — only the latest code is valid
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitedError"
          description: Rate limited — 3 per 10 minutes
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminError"
          description: Error
      summary: Issue a fresh second-factor challenge
      tags:
        - Admin Auth
  /admin/auth/bootstrap:
    get:
      operationId: adminBootstrap
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBootstrap"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminError"
          description: Error
      summary: Resolve the splash screen's routing decision
      tags:
        - Admin Auth
  /admin/auth/devices:
    get:
      operationId: adminListDevices
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTrustedDeviceList"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminError"
          description: Error
      security:
        - bearer: []
      summary: List this account's trusted devices
      tags:
        - Admin Auth
  /admin/auth/devices/{id}:
    delete:
      operationId: adminRevokeDevice
      parameters:
        - description: Device id
          in: path
          name: id
          required: true
          schema:
            description: Device id
            type: string
        - description: Idempotency key, minted once per operator intent (not per network attempt). Replaying a key must return the first result rather than acting again.
          in: header
          name: Idempotency-Key
          required: true
          schema:
            description: Idempotency key, minted once per operator intent (not per network attempt). Replaying a key must return the first result rather than acting again.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeDeviceResult"
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminError"
          description: Not Found
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminError"
          description: Error
      security:
        - bearer: []
      summary: Revoke a trusted device
      tags:
        - Admin Auth
  /admin/auth/login:
    post:
      operationId: adminLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResult"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidCredentialsError"
          description: Wrong credentials
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDisabledError"
          description: Account disabled
        "423":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountLockedError"
          description: Account locked
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminError"
          description: Error
      summary: Sign in with email and password
      tags:
        - Admin Auth
  /admin/auth/logout:
    post:
      operationId: adminLogout
      parameters:
        - description: Idempotency key, minted once per operator intent (not per network attempt). Replaying a key must return the first result rather than acting again.
          in: header
          name: Idempotency-Key
          required: true
          schema:
            description: Idempotency key, minted once per operator intent (not per network attempt). Replaying a key must return the first result rather than acting again.
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminError"
          description: Error
      security:
        - bearer: []
      summary: Invalidate the session server-side
      tags:
        - Admin Auth
  /admin/auth/refresh:
    post:
      operationId: adminRefreshSession
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminError"
          description: Error
      security:
        - bearer: []
      summary: Refresh the session token
      tags:
        - Admin Auth
  /admin/auth/unlock:
    post:
      operationId: adminUnlock
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUnlockRequest"
        required: true
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminError"
          description: Wrong password
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminError"
          description: Error
      security:
        - bearer: []
      summary: Re-verify a locked session with the password
      tags:
        - Admin Auth
  /admin/diagnostics:
    post:
      operationId: adminSubmitDiagnostics
      parameters:
        - description: Idempotency key, minted once per operator intent (not per network attempt). Replaying a key must return the first result rather than acting again.
          in: header
          name: Idempotency-Key
          required: true
          schema:
            description: Idempotency key, minted once per operator intent (not per network attempt). Replaying a key must return the first result rather than acting again.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagnosticsRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticsReceipt"
          description: Accepted
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminError"
          description: Rejected — the payload carried customer PII
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminError"
          description: Error
      security:
        - bearer: []
      summary: Upload diagnostics for support
      tags:
        - Admin Settings
  /admin/profile:
    get:
      operationId: adminGetProfile
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProfile"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminError"
          description: Error
      security:
        - bearer: []
      summary: Get the signed-in admin's profile
      tags:
        - Admin Settings
    put:
      operationId: adminUpdateProfile
      parameters:
        - description: Idempotency key, minted once per operator intent (not per network attempt). Replaying a key must return the first result rather than acting again.
          in: header
          name: Idempotency-Key
          required: true
          schema:
            description: Idempotency key, minted once per operator intent (not per network attempt). Replaying a key must return the first result rather than acting again.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminProfileRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProfile"
          description: OK — the whole updated object
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminError"
          description: Error
      security:
        - bearer: []
      summary: Update the admin's preferences
      tags:
        - Admin Settings
  /admin/queued-actions/count:
    get:
      operationId: adminQueuedActionsCount
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedActionsCount"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminError"
          description: Error
      security:
        - bearer: []
      summary: Count unsynced offline actions
      tags:
        - Admin Settings
  /admin/settings/notifications:
    get:
      operationId: adminGetNotificationSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminError"
          description: Error
      security:
        - bearer: []
      summary: Get notification channels and quiet hours
      tags:
        - Admin Settings
    put:
      operationId: adminUpdateNotificationSettings
      parameters:
        - description: Idempotency key, minted once per operator intent (not per network attempt). Replaying a key must return the first result rather than acting again.
          in: header
          name: Idempotency-Key
          required: true
          schema:
            description: Idempotency key, minted once per operator intent (not per network attempt). Replaying a key must return the first result rather than acting again.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNotificationSettingsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
          description: OK — the whole updated object, so the optimistic update settles on the server's copy
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminError"
          description: A critical channel was sent; those are not preferences
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminError"
          description: Error
      security:
        - bearer: []
      summary: Update the configurable notification channels
      tags:
        - Admin Settings
  /admin/settings/security:
    get:
      operationId: adminGetSecuritySettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecuritySettings"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminError"
          description: Error
      security:
        - bearer: []
      summary: Get biometric, device and session security state
      tags:
        - Admin Settings
    patch:
