version: "2"

# NOTE: in golangci-lint v2, linter settings live UNDER `linters:`, not at the top level.
# A top-level `settings:` block is silently IGNORED — the linters still run, but with
# their defaults, so the config looks correct and does nothing. Learned the hard way.

linters:
  enable:
    # THE LOAD-BEARING ONE.
    #
    # Go has no real enums and no switch exhaustiveness. Our booking state machine has 13
    # states and 13 actions (ROADMAP §7). Without this, adding a 14th state compiles
    # cleanly and silently falls through every switch that forgot it — precisely the class
    # of bug the pure state machine exists to make impossible. Java's enum gave this free.
    - exhaustive

    # Guards the purity of the state machine (see depguard settings below).
    - depguard

    # Money paths. An ignored `err` from a ledger insert is a rupee that vanishes.
    - errcheck
    - errorlint # errors.Is/As over == and bare type asserts; %w over %v
    - nilerr    # returning nil after checking err != nil

    # Database resource leaks — a leaked rows/conn takes the pool down under load.
    - rowserrcheck
    - sqlclosecheck
    - bodyclose

    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell

  settings:
    exhaustive:
      # A `default:` clause must NOT excuse a missing case.
      #
      # This is the setting that does the work. With the default (true), writing `default:`
      # silently satisfies the linter — and a forgotten BookingState quietly takes the
      # default branch instead of failing the build. Do not "fix a lint error" by turning
      # this back on.
      default-signifies-exhaustive: false

    errcheck:
      check-type-assertions: true
      check-blank: true

    depguard:
      rules:
        # THE PURITY RULE — PLAN-P0's ArchUnit guard, in Go.
        #
        # The booking state machine must be a pure function over enums: no database, no
        # clock, no network, not even a context. That purity is what lets us prove it
        # correct by trying all 169 (state × action) combinations in a millisecond.
        #
        # If it ever "needs" one of these imports, the design is wrong — the decision has
        # leaked out of the machine and into the world. Fail the build, loudly.
        #
        # Only these two files are constrained. `deny` beats `allow`, which is why the
        # stdlib entries below still bite despite $gostd being allowed.
        booking-state-machine-must-stay-pure:
          files:
            - "**/internal/booking/state.go"
            - "**/internal/booking/statemachine.go"
          allow:
            - $gostd
          deny:
            - pkg: "database/sql"
              desc: "the state machine is PURE — legality comes from enums, never from a query"
            - pkg: "github.com/jackc/pgx"
              desc: "the state machine is PURE — no database"
            - pkg: "net/http"
              desc: "the state machine is PURE — transport does not belong in the domain"
            - pkg: "context"
              desc: "the state machine is PURE — nothing in it blocks, so nothing needs cancelling"
            - pkg: "time"
              desc: "the state machine is PURE — a transition that depends on the clock cannot be tested exhaustively"

        # MODULE DEPENDENCY RULE — the architecture's allowed-import graph, enforced.
        #
        # The domain graph must stay ACYCLIC and point INWARD toward the stable cores
        # (money, identity, booking). The "core" modules below must NEVER import a
        # consumer/leaf module (ledger, notifications, verification, ops, reviews, media):
        # those CONSUME booking's events (or are invoked by transport) — a core is never
        # called back into. Enforcing it here means a cycle or an inverted dependency fails
        # the build, not code review.
        #
        # Composition (cmd, internal/app) and transport (internal/httpapi) are deliberately
        # NOT listed — they wire everything together and may import any module.
        cores-must-not-import-consumers:
          files:
            # Production files only — a test may legitimately import sibling modules to seed data.
            - "!**/*_test.go"
            - "**/internal/order/**"
            - "**/internal/identity/**"
            - "**/internal/auth/**"
            - "**/internal/catalog/**"
            - "**/internal/address/**"
            - "**/internal/booking/**"
          deny:
            - pkg: "github.com/kokkondaBhanuteja/sethu-care/internal/ledger"
              desc: "a core must not import a consumer — ledger consumes booking events, never the reverse"
            - pkg: "github.com/kokkondaBhanuteja/sethu-care/internal/notifications"
              desc: "a core must not import a consumer — notifications consumes events"
            - pkg: "github.com/kokkondaBhanuteja/sethu-care/internal/verification"
              desc: "a core must not import a consumer — verification is invoked by transport / consumes events"
            - pkg: "github.com/kokkondaBhanuteja/sethu-care/internal/ops"
              desc: "a core must not import a consumer — ops orchestrates booking, not the reverse"
            - pkg: "github.com/kokkondaBhanuteja/sethu-care/internal/reviews"
              desc: "a core must not import a consumer — reviews consumes events"
            - pkg: "github.com/kokkondaBhanuteja/sethu-care/internal/media"
              desc: "a core must not import media"

        # money is the deepest leaf — a pure value object that depends on NOTHING else in
        # the domain. If money ever imports another internal package, a rule has leaked into
        # the value type.
        money-is-a-pure-leaf:
          files:
            # Production files only — the external money_test package imports money itself.
            - "!**/*_test.go"
            - "**/internal/money/**"
          deny:
            - pkg: "github.com/kokkondaBhanuteja/sethu-care/internal"
              desc: "money is a pure value object — it must depend on nothing else in the domain"

formatters:
  enable:
    - gofmt
    - goimports
