# Move to .github/workflows/backend.yml
name: backend

on:
  push:
    branches: [developer, main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "db/**"
      - "api/**"
      - ".golangci.yml"
      - "Makefile"
      - "sqlc.yaml"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "db/**"
      - "api/**"
      - ".golangci.yml"
      - "Makefile"
      - "sqlc.yaml"
      - ".github/workflows/backend.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Lint (golangci-lint, incl. depguard dependency rules)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: OpenAPI contract is up to date (drift guard)
        run: |
          go run ./cmd/genopenapi > /tmp/openapi.gen.yaml
          diff -u api/openapi.yaml /tmp/openapi.gen.yaml \
            || (echo "::error::api/openapi.yaml is stale — run 'make openapi' and commit." && exit 1)

      - name: Test (race detector; testcontainers use the runner's Docker)
        run: go test -race ./...
